const RISK = ["#fc9272","#fb6a4a","#de2d26","#a50f15","#67000d"], SHADE = "#2a78d6";
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const map = L.map('map', {preferCanvas: true, zoomControl: false}).setView([35.87, 128.60], 12);
L.control.zoom({position: 'topright'}).addTo(map);
if (location.protocol === 'http:' || location.protocol === 'https:') {
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'}).addTo(map);
}
if (location.protocol === 'file:') document.getElementById('webnote').hidden = false;
L.geoJSON(BOUNDARY, {style: {color: '#9c9b96', weight: 0.8, fillColor: '#ffffff', fillOpacity: 0.15},
  onEachFeature: (f, l) => l.bindTooltip(esc(f.properties.n), {sticky: true})}).addTo(map);
const layer = L.layerGroup().addTo(map);
const markers = STOPS.map(p => {
  const m = L.circleMarker([p.la, p.lo], {radius: p.p ? 8 : 3 + p.q * 0.6, weight: p.p ? 2 : 0, color: '#111',
    fillColor: p.sh ? SHADE : RISK[p.q], fillOpacity: p.p ? 0.95 : 0.8});
  m.bindPopup(() => `<div class="pop"><b>${p.rk}위 ${esc(p.n)}</b>${p.p ? '<span class="tag">최우선</span>' : ''}<br>` +
    `${esc(p.gu)} ${esc(p.dong)} · ${esc(p.tn)}<br>` +
    `33℃ 이상 시간대 승차 <b>${p.b}</b>명/일 · 기대 대기 ${p.w}분<br>` +
    `그늘막·냉방쉘터 ${p.sh ? '있음' : '없음'} · 200m 안 무더위쉼터 ${p.cs}곳<br>` +
    `동네 65세 이상 ${p.el}% · 기온 관측소 ${esc(p.stn)}</div>`,
    {autoPanPaddingTopLeft: L.point(document.querySelector('.panel').offsetWidth + 24, 16)});
  m.stop = p; return m;
});
for (const s of STATIONS) {
  L.marker([s.la, s.lo], {interactive: false, icon: L.divIcon({className: '', iconSize: null,
    html: `<div class="stn">■ ${esc(s.n)} ${s.h}h</div>`})}).addTo(map);
}
const $ = id => document.getElementById(id);
function apply() {
  const gu = $('gu').value, ty = $('ty').value, core = $('core').checked;
  layer.clearLayers(); let n = 0;
  for (const m of markers) {
    const p = m.stop;
    if ((gu && p.gu !== gu) || (ty !== '' && String(p.t) !== ty) || (core && !p.p)) continue;
    layer.addLayer(m); n++;
  }
  for (const m of markers) if (m.stop.p && layer.hasLayer(m)) m.bringToFront();
  $('count').textContent = `정류장 ${n.toLocaleString()}곳 표시 중`;
}
['gu', 'ty', 'core'].forEach(id => $(id).addEventListener('change', apply));
$('names').innerHTML = [...new Set(STOPS.map(p => p.n))].sort().map(n => `<option value="${esc(n)}">`).join('');
function go() {
  const q = $('q').value.trim(); if (!q) return;
  const m = markers.find(m => m.stop.n === q) ||
    markers.filter(m => m.stop.n.includes(q)).sort((x, y) => x.stop.rk - y.stop.rk)[0];
  if (!m) { $('count').textContent = `"${q}"을(를) 찾지 못했어요`; return; }
  if (!layer.hasLayer(m)) { $('gu').value = ''; $('ty').value = ''; $('core').checked = false; apply(); }
  map.setView(m.getLatLng(), 16, {animate: false});
  const w = document.querySelector('.panel').offsetWidth;
  if (map.getSize().x > w + 320) map.panBy([-(w / 2 + 10), 0], {animate: false});
  m.openPopup();
}
$('q').addEventListener('change', go);
$('q').addEventListener('compositionend', () => setTimeout(() => { if (document.activeElement !== $('q')) go(); }, 0));
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); setTimeout(go, 0); } });
$('fold').addEventListener('click', () => { const pn = document.querySelector('.panel'); pn.classList.toggle('min');
  $('fold').textContent = pn.classList.contains('min') ? '펴기' : '접기'; });
if (window.innerWidth < 600) $('fold').click();
apply();
